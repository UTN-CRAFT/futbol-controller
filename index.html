<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Control Robot Fútbol UTN</title>
  <style>
    * {
      box-sizing: border-box;
      touch-action: none;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: #121212;
      color: #ffffff;
      text-align: center;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      height: 100vh;
    }
    .top-bar {
      padding: 12px 16px;
      background: #1e1e1e;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 2px 6px rgba(0,0,0,0.5);
      z-index: 10;
    }
    button {
      padding: 10px 18px;
      font-size: 14px;
      font-weight: 700;
      background: #007acc;
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: background 0.2s ease;
    }
    button:active {
      transform: scale(0.98);
    }
    .status-connected {
      background: #28a745 !important;
    }
    select {
      padding: 10px 12px;
      font-size: 14px;
      font-weight: 600;
      border-radius: 8px;
      background: #2b2b2b;
      color: white;
      border: 1px solid #444;
      outline: none;
    }
    .controls {
      flex: 1;
      display: flex;
      justify-content: space-around;
      align-items: center;
      padding: 20px;
    }
    .slider-box {
      display: flex;
      flex-direction: column;
      align-items: center
