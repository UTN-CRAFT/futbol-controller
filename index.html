<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Control Robot Fútbol UTN</title>
  <style>
    * {
      box-sizing: border-box;
      touch-action: none;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: #121212;
      color: #ffffff;
      text-align: center;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      height: 100vh;
    }
    .top-bar {
      padding: 12px 16px;
      background: #1e1e1e;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 2px 6px rgba(0,0,0,0.5);
      z-index: 10;
    }
    button {
      padding: 10px 18px;
      font-size: 14px;
      font-weight: 700;
      background: #007acc;
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: background 0.2s ease;
    }
    button:active {
      transform: scale(0.98);
    }
    .status-connected {
      background: #28a745 !important;
    }
    select {
      padding: 10px 12px;
      font-size: 14px;
      font-weight: 600;
      border-radius: 8px;
      background: #2b2b2b;
      color: white;
      border: 1px solid #444;
      outline: none;
    }
    .controls {
      flex: 1;
      display: flex;
      justify-content: space-around;
      align-items: center;
      padding: 20px;
    }
    .slider-box {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100%;
    }
    .label {
      font-weight: 700;
      font-size: 14px;
      letter-spacing: 1px;
      color: #aaa;
      margin-bottom: 15px;
    }
    /* Estilos táctiles para sliders */
    input[type=range] {
      -webkit-appearance: none;
      background: #2c2c2c;
      border-radius: 12px;
      outline: none;
    }
    input[type=range]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background: #007acc;
      border: 3px solid #ffffff;
      cursor: pointer;
      box-shadow: 0 0 10px rgba(0,0,0,0.5);
    }
    .vertical-container {
      width: 120px;
      height: 280px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .vertical {
      transform: rotate(-90deg);
      width: 260px;
      height: 24px;
    }
    .horizontal {
      width: 260px;
      height: 24px;
    }
    .readout {
      margin-top: 15px;
      font-size: 13px;
      font-family: monospace;
      color: #666;
    }
  </style>
</head>
<body>

  <div class="top-bar">
    <button id="btnConnect" onclick="conectarBLE()">CONECTAR BLE</button>
    <select id="selectEquipo">
      <option value="1">Equipo 1</option>
      <option value="2">Equipo 2</option>
      <option value="3">Equipo 3</option>
      <option value="4">Equipo 4</option>
      <option value="5">Equipo 5</option>
      <option value="6">Equipo 6</option>
    </select>
  </div>

  <div class="controls">
    <!-- Slider Eje Y: Acelerador (Vertical) -->
    <div class="slider-box">
      <div class="label">ACELERADOR (Y)</div>
      <div class="vertical-container">
        <input type="range" id="sliderY" class="vertical" min="-100" max="100" value="0">
      </div>
      <div class="readout" id="readoutY">Y: 0</div>
    </div>

    <!-- Slider Eje X: Dirección (Horizontal) -->
    <div class="slider-box">
      <div class="label">DIRECCIÓN (X)</div>
      <input type="range" id="sliderX" class="horizontal" min="-100" max="100" value="0">
      <div class="readout" id="readoutX">X: 0</div>
    </div>
  </div>

<script>
  // UUIDs estándar de Nordic UART Service (NUS)
  const UART_SERVICE_UUID = "6e400001-b5a3-f393-e0a9-e50e24dcca9e";
  const UART_RX_CHAR_UUID = "6e400002-b5a3-f393-e0a9-e50e24dcca9e";

  let bleDevice = null;
  let rxCharacteristic = null;
  let intervalEnvio = null;

  const btnConnect = document.getElementById("btnConnect");
  const selectEquipo = document.getElementById("selectEquipo");
  const sliderY = document.getElementById("sliderY");
  const sliderX = document.getElementById("sliderX");
  const readoutY = document.getElementById("readoutY");
  const readoutX = document.getElementById("readoutX");

  // Efecto resorte táctil: vuelven a 0 al soltar
  function resetY() {
    sliderY.value = 0;
    readoutY.innerText = "Y: 0";
  }
  function resetX() {
    sliderX.value = 0;
    readoutX.innerText = "X: 0";
  }

  sliderY.addEventListener("input", () => { readoutY.innerText = `Y: ${sliderY.value}`; });
  sliderX.addEventListener("input", () => { readoutX.innerText = `X: ${sliderX.value}`; });

  sliderY.addEventListener("touchend", resetY);
  sliderY.addEventListener("mouseup", resetY);
  sliderX.addEventListener("touchend", resetX);
  sliderX.addEventListener("mouseup", resetX);

  async function conectarBLE() {
    try {
      bleDevice = await navigator.bluetooth.requestDevice({
        filters: [{ namePrefix: "ROBOT" }, { namePrefix: "FUTBOL" }],
        optionalServices: [UART_SERVICE_UUID]
      });

      bleDevice.addEventListener('gattserverdisconnected', onDisconnected);

      const server = await bleDevice.gatt.connect();
      const service = await server.getPrimaryService(UART_SERVICE_UUID);
      rxCharacteristic = await service.getCharacteristic(UART_RX_CHAR_UUID);

      btnConnect.innerText = bleDevice.name || "CONECTADO";
      btnConnect.classList.add("status-connected");

      // Loop de transmisión periódica a 25 Hz (cada 40 ms)
      if (!intervalEnvio) {
        intervalEnvio = setInterval(procesarYEnviar, 40);
      }
    } catch (error) {
      console.log("Conexión cancelada o error:", error);
    }
  }

  function onDisconnected() {
    btnConnect.innerText = "CONECTAR BLE";
    btnConnect.classList.remove("status-connected");
    rxCharacteristic = null;
    if (intervalEnvio) {
      clearInterval(intervalEnvio);
      intervalEnvio = null;
    }
    resetY();
    resetX();
  }

  function procesarYEnviar() {
    if (!rxCharacteristic) return;

    // 1. Obtener ID del equipo seleccionado (1 a 6)
    let equipo = parseInt(selectEquipo.value, 10);

    // 2. Leer valores de los deslizadores (-100 a +100)
    let y = parseInt(sliderY.value, 10);
    let x = parseInt(sliderX.value, 10);

    y = Math.max(-100, Math.min(100, y));
    x = Math.max(-100, Math.min(100, x));

    // 3. Trama de 4 bytes: [Header 0x55, equipo, ejeY, ejeX]
    let buffer = new Int8Array([0x55, equipo, y, x]);

    // Transmisión directa sin acuse de recibo para mínima latencia
    rxCharacteristic.writeValueWithoutResponse(buffer).catch(() => {});
  }
</script>
</body>
</html>
